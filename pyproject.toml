[project]
name = "djangogirls"
version = "0.0.0"
description = "Django Girls website"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dj-database-url==0.5.0",
  "django>=3.2,<4",
  "django-admin-sortable2==1.0.4",
  "django-autoslug==1.9.4",
  "django-bleach<4",
  "django-click==2.3.0",
  "django-countries",
  "django-date-extensions",
  "django-debug-toolbar",
  "django-extensions",
  "django-formtools>=2.5",
  "django-gulp-rev==0.2",
  "django-leaflet==0.24.0",
  "django-markdown-deux==1.0.5",
  "django-recaptcha",
  "django-sendgrid-v5==0.8.1",
  "django-storages[boto3]==1.7.1",
  "django-tinymce",
  "django-unused-media==0.1.13",
  "dnspython",
  "easy-thumbnails",
  "easydict==1.10",
  "pillow==12.3.0",
  "psycopg2-binary==2.9.13",
  "pyquery==2.1.0",
  "python-dotenv==0.21.0",
  "urlextract",
  # Integrations
  "google-api-python-client==2.37.0",
  "icalendar==4.0.3",
  "oauth2client==4.1.3",
  "py-trello==0.13.0",
  "sentry-sdk==2.24.1",
  "slack-sdk==3.19.5",
  "stripe",
]

[dependency-groups]
dev = [
  "pre-commit==4.6.2",
  # Linting / formatting
  "autoflake==1.4",
  "black==26.3.1",
  "flake8==4.0.1",
  "isort==5.8.0",
  # Testing
  "freezegun",
  "pytest==6.2.5",
  "pytest-cov==2.12.1",
  "pytest-django==4.4.0",
  "pytest-dotenv==0.5.2",
  "pytest-env==0.6.2",
  "pytest-mock==3.10.0",
  "vcrpy==8.3.0",
]

[tool.uv]
# This is a Django application, not an installable package.
package = false

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
line-length = 120
lint.select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "FBT",  # flake8-boolean-trap
  "B",    # flake8-bugbear
  "C",    # flake8-comprehensions
  "DJ",   # flake8-django
  "INT",  # flake8-gettext
  "PIE",  # flake8-pie
  "Q",    # flake8-quotes
  "SIM",  # flake8-simplify
  "PGH",  # pygrep-hooks
  "PLE",  # pylint error
  "PLR",  # pylint refactor
  "PLW",  # pylint warning
  "UP",   # pyupgrade
  "C901", # mccabe
  "N",    # pep8-naming
  "YTT",  # flake8-2020,
  "RUF"
]

extend-exclude = [
  ".eggs",
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".env",
  ".venv",
  "**locale/**",
  "**migrations/**",
  "node_modules",
  "venv",
]

lint.extend-ignore = [
  "B006",  # Do not use mutable data structures for argument defaults
  "B011",  # tests use assert False
  "B019",  # Use of `functools.lru_cache` or `functools.cache` on methods can lead to memory leaks
  "B905",  # `zip()` without an explicit `strict=` parameter
  "C901",  # too complex functions
  "DJ001", # Avoid using `null=True` on string-based fields such as CharField
  "E402",  # module level import not at top of file
  "E731",  # do not assign a lambda expression, use a def
  "FBT002",   # Boolean default value in function definition
  "FBT003",   # Boolean positional value in function call
  "PLR0911",  # Too many return statements
  "PLR0912",  # Too many branches
  "PLR0913",  # Too many arguments to function call
  "PLR0915",  # Too many statements
  "PLR2004",  # Magic value used in comparison, consider replacing with a constant variable
  "RUF012",   # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102",   # Use a single `if` statement instead of nested `if` statements
  "SIM115", # Ignore open-file-with-context-handler 
  "F403", # Import * instead of specifying modules
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "F401"  # unused-import
]
"djangogirls/urls.py" = [
  "RUF005"  # Consider iterable unpacking instead of concatenation
]
"tests/core/test_admin.py" = [
  "RUF017"  # Avoid quadratic list summation
]
"tests/mocks/__init__.py" = [
  "PGH004" # import *
]
"djangogirls/settings.py" = [
  "PLW1508", # Use boolean instead string for environment variable
]  

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = [
  "applications",
  "coach",
  "contact",
  "core",
  "djangogirls",
  "donations",
  "globalpartners",
  "jobboard",
  "organize",
  "patreonmanager",
  "pictures",
  "sponsor",
  "story",
]
extra-standard-library = ["dataclasses"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80